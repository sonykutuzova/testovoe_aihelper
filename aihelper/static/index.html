<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Описание товара</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
<main>
  <h1>Описание товара</h1>
  <p>Вставьте данные прибора в JSON, чтобы подготовить карточку.</p>
  <div class="columns">
    <form id="form">
      <label for="input">Данные товара</label>
      <textarea id="input" spellcheck="false" required>{
  "name": "Манометр показывающий DM 02",
  "manufacturer": "Манотомь",
  "specs": {
    "диапазон измерений": "0–1,6 МПа",
    "класс точности": "1,5",
    "присоединение": "G1/2",
    "диаметр корпуса": "100 мм"
  },
  "description": "Прибор предназначен для измерения избыточного давления..."
}</textarea>
      <button id="generate" type="submit">Создать описание</button>
      <p class="note">Для генерации нужен OPENAI_API_KEY в окружении сервера.</p>
      <p id="error" role="alert" hidden></p>
    </form>
    <section aria-labelledby="result-title">
      <div class="result-header"><h2 id="result-title">Результат</h2><button id="copy" type="button" disabled>Копировать JSON</button></div>
      <pre id="output" tabindex="0">Здесь появится карточка товара.</pre>
      <p id="status" role="status"></p>
    </section>
  </div>
</main>
</body>
</html>
